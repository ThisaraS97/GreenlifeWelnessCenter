  <script>
    function loadTrainers(category) {
      if (!category) {
        document.getElementById("trainer-dropdown").innerHTML = "<option value=''>-- Select Trainer --</option>";
        return;
      }

      const xhr = new XMLHttpRequest();
      xhr.open("GET", "get-trainers.php?category=" + encodeURIComponent(category), true);
      xhr.onload = function () {
        if (xhr.status === 200) {
          document.getElementById("trainer-dropdown").innerHTML = xhr.responseText;
        }
      };
      xhr.send();
    }
  </script>
</head>

        <div class="col-md-6">
